services:
  - type: web
    name: wedigo-careers
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedigo-db
          property: connectionString
      - key: JWT_SECRET
        value: wedigo_careers_jwt_secret_key_2026

databases:
  - name: wedigo-db
    plan: free
